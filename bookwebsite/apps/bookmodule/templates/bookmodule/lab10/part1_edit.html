{% extends "layouts/base.html" %}
{% block content %}
<h2>Edit Book (Part 1)</h2>
<form method="post">
    {% csrf_token %}
    <label>Title:</label><br><input type="text" name="title" value="{{ book.title }}" required><br><br>
    <label>Author:</label><br><input type="text" name="author" value="{{ book.author }}" required><br><br>
    <label>Price:</label><br><input type="number" step="0.01" name="price" value="{{ book.price }}" required><br><br>
    <label>Edition:</label><br><input type="number" name="edition" value="{{ book.edition }}" required><br><br>
    <button type="submit">Update</button>
</form>
<br>
<a href="{% url 'lab10_p1_list' %}">Back to List</a>
{% endblock content %}
